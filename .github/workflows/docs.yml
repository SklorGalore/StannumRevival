name: Docs

# Builds the documentation site (docs-site/) on pull requests that touch it,
# and publishes it to GitHub Pages from main. Every build first reruns the
# reference tests for the Verification page, so a change to the solvers
# rebuilds the site too.
on:
  pull_request:
    paths:
      - "docs-site/**"
      - "crates/**"
      - "Cargo.lock"
      - "scripts/verify.ps1"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "crates/**"
      - "Cargo.lock"
      - "scripts/verify.ps1"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# The workflow only reads the repository. The deploy job asks for more.
permissions:
  contents: read

# One Pages deployment at a time; a newer push replaces a queued one, but a
# deployment in progress is never cut off.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Reruns the reference tests and rewrites src/data/verification.json,
      # the Verification page's tables, for this commit. A check over its
      # tolerance fails the build.
      - name: Verification tables
        shell: pwsh
        timeout-minutes: 30
        working-directory: .
        run: ./scripts/verify.ps1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Astro 7 needs Node 22.23.4 or later; runner images can lag on 22.
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs-site/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
