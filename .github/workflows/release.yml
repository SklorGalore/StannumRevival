name: Release

# Builds installers for Windows, macOS (Apple silicon) and Linux, and for
# each of them the stannum Python wheel and the stannum-cli binary.
#
# Releases follow git flow: release/vX.Y.Z is cut from development (hotfix/vX.Y.Z
# from main), merged into main, and the merge commit is tagged vX.Y.Z.
#
# - Pushing a v* tag builds them and attaches them to a draft GitHub release
#   whose notes are that version's section of CHANGELOG.md. Publish the draft
#   by hand once the installers have been tried.
# - Every push to a release/v* or hotfix/v* branch builds release-candidate
#   installers as workflow artifacts, and checks that the branch's version,
#   the version fields and the changelog agree.
# - Pull requests that change the release setup build the installers too, so
#   the setup is proven before a tag.
# - Run it by hand (workflow_dispatch) for test installers from any branch.
#
# The installers are signed for the app's updater with the
# TAURI_SIGNING_PRIVATE_KEY secret (public key: src-tauri/updater-key.pub),
# and the draft release gets a latest.json that the app reads once
# the release is published. Builds other than tag pushes sign with a
# throwaway key when the secret isn't there, to prove the updater build.
#
# See docs/releasing.md for the whole procedure.
on:
  push:
    tags: ["v*"]
    branches: ["release/v*", "hotfix/v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release/**"
      - "scripts/ci/test-python.ps1"
      - "src-tauri/capabilities/**"
      - "src-tauri/updater-key.pub"
      - "crates/stannum-py/pyproject.toml"
      - "LICENSE"
      - "THIRD-PARTY-*"
      - "src-tauri/tauri*.conf.json"
      - "src-tauri/icons/**"
  workflow_dispatch:

# The workflow only reads the repository. The publish job asks for more.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check version and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check versions and changelog
        id: check
        shell: pwsh
        env:
          # Only a tag push is held to "tag matches version", and only a
          # release/hotfix branch (pushed, or the head of a PR) to "branch
          # matches version".
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          BRANCH: ${{ github.head_ref || (github.ref_type == 'branch' && github.ref_name) || '' }}
        run: ./scripts/release/check-release.ps1 -Tag "$env:TAG" -Branch "$env:BRANCH" -NotesFile release-notes.md
      # The installers, wheels and CLI archives ship THIRD-PARTY-LICENSES.txt
      # as committed, so it must list the dependencies being built.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the third-party licence list is current
        shell: pwsh
        run: |
          ./scripts/release/third-party-licenses.ps1 -Out "$env:RUNNER_TEMP/licenses.txt"
          $want = Get-Content "$env:RUNNER_TEMP/licenses.txt" -Raw
          $have = Get-Content THIRD-PARTY-LICENSES.txt -Raw
          if ($want -ne $have) {
            throw 'THIRD-PARTY-LICENSES.txt is out of date. Run scripts/release/third-party-licenses.ps1 and commit it, or take the file from this run''s third-party-licenses artifact.'
          }
      # The up-to-date list, for committing from a machine without pwsh.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: third-party-licenses
          path: ${{ runner.temp }}/licenses.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: Installers (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundles: msi,nsis
            artifact: windows-x64
          # macos-latest runners are Apple silicon, so this builds for arm64.
          # The app bundle is what the updater installs (Stannum.app.tar.gz).
          - name: macOS arm64
            os: macos-latest
            bundles: app,dmg
            artifact: macos-arm64
          # The oldest supported Ubuntu, so the Linux builds run on older glibc.
          - name: Linux x64
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As in CI: the .deb files are cached per runner image, so a slow
      # Ubuntu mirror only costs time when the image changes.
      - name: Read the runner image
        if: runner.os == 'Linux'
        id: image
        run: echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore Tauri system packages
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tauri-apt
          key: tauri-apt-release-${{ steps.image.outputs.id }}-${{ hashFiles('scripts/ci/install-tauri-deps.ps1') }}
          restore-keys: |
            tauri-apt-release-${{ steps.image.outputs.id }}-
            tauri-apt-release-
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        shell: pwsh
        timeout-minutes: 30
        run: ./scripts/ci/install-tauri-deps.ps1 -CacheDir ~/.cache/tauri-apt -ExtraPackages patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release
      - run: npm ci
      # The macOS app is signed ad hoc (src-tauri/tauri.macos.conf.json sets
      # signingIdentity "-"): no Apple account, but the bundle is sealed, so a
      # downloaded copy asks to be allowed once instead of being called
      # "damaged". The Windows installers are unsigned. Tauri signs with a
      # real identity when these secrets exist: APPLE_CERTIFICATE,
      # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
      # APPLE_PASSWORD and APPLE_TEAM_ID for macOS; Windows needs a
      # certificate thumbprint in tauri.windows.conf.json. See docs/releasing.md.
      # Separately, every installer is signed for the updater with the
      # repository's key: see the top of this file and
      # scripts/release/build-installers.ps1.
      - name: Build installers
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE: ${{ github.ref_type == 'tag' }}
        run: ./scripts/release/build-installers.ps1 -Bundles '${{ matrix.bundles }}' -Release:($env:RELEASE -eq 'true')
      - name: Collect installers
        shell: pwsh
        run: ./scripts/release/collect-bundles.ps1 -OutDir installers
      - name: Check the macOS app is signed as a bundle
        if: runner.os == 'macOS'
        shell: pwsh
        run: ./scripts/release/verify-macos-signature.ps1 -Path installers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.artifact }}
          path: installers/*
          if-no-files-found: error

  python:
    name: Python wheel and CLI (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
            wheel_args: ""
          - name: macOS arm64
            os: macos-latest
            artifact: macos-arm64
            wheel_args: ""
          # The wheel is linked against an old glibc with zig (manylinux2014);
          # the CLI is built on the oldest supported Ubuntu, as the installers.
          - name: Linux x64
            os: ubuntu-22.04
            artifact: linux-x64
            wheel_args: -Manylinux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-python
      # One abi3 wheel per platform (Python 3.10 and newer), tested in a
      # fresh venv before it is kept.
      - name: Build and test the wheel
        shell: pwsh
        run: ./scripts/ci/test-python.ps1 -Out wheels ${{ matrix.wheel_args }}
      - name: Build and pack stannum-cli
        shell: pwsh
        run: ./scripts/release/build-cli.ps1 -OutDir cli -Platform ${{ matrix.artifact }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ matrix.artifact }}
          path: wheels/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.artifact }}
          path: cli/*
          if-no-files-found: error

  # latest.json, which the app's updater reads from the latest published
  # release. Made on every run, so the manifest is proven before a tag.
  manifest:
    name: Updater manifest
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          pattern: "{installers-*,release-notes}"
      - name: Write latest.json
        id: manifest
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.check.outputs.version) }}
        run: |
          if (-not (Get-ChildItem -Path out -Recurse -File -Filter '*.sig')) {
            Write-Host '::warning title=No updater manifest::The installers are not signed for the updater (no TAURI_SIGNING_PRIVATE_KEY), so this release has no latest.json.'
            exit 0
          }
          ./scripts/release/updater-manifest.ps1 -Dir out -Version $env:VERSION -Tag $env:TAG `
            -NotesFile out/release-notes/release-notes.md -Out latest.json
          Get-Content latest.json
          "made=true" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.manifest.outputs.made == 'true'
        with:
          name: updater-manifest
          path: latest.json
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: [check, build, python, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $files = Get-ChildItem -Path out -Recurse -File |
            Where-Object { $_.Directory.Name -match '^(installers|python|cli)-|^updater-manifest$' } |
            ForEach-Object FullName
          $pre = if ($env:VERSION -match '-') { '--prerelease' } else { $null }
          gh release create $env:TAG @files --draft --verify-tag $pre `
            --title "Stannum $env:VERSION" --notes-file out/release-notes/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
