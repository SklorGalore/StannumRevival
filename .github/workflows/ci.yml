name: CI

on:
  pull_request:
  push:
    branches: [main, development, "release/**", "hotfix/**"]
  workflow_dispatch:

# The workflow only reads the repository. Jobs that need more ask for it.
permissions:
  contents: read

# A new push to a PR cancels that PR's older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Rust core and desktop shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The .deb files are cached per runner image, so a slow Ubuntu mirror
      # only costs time when the image changes (about once a week).
      # ImageOS and ImageVersion are runner environment variables, which
      # the env context can't see, so pass them on as a step output.
      - name: Read the runner image
        id: image
        run: echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore Tauri system packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tauri-apt
          key: tauri-apt-${{ runner.os }}-${{ steps.image.outputs.id }}-${{ hashFiles('scripts/ci/install-tauri-deps.ps1') }}
          # A new runner image misses the exact key; seed apt with the last
          # image's packages so only the changed ones are downloaded.
          restore-keys: |
            tauri-apt-${{ runner.os }}-
      - name: Install Tauri system dependencies
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/ci/install-tauri-deps.ps1 -CacheDir ~/.cache/tauri-apt
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all -- --check
      # Tauri embeds ../dist at compile time; an empty folder is enough for checks.
      - name: Placeholder frontend
        run: mkdir -p dist
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -p stannum-core -p rs-power -p nodal

  frontend:
    name: Frontend build and browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Frontend unit tests
        run: npm test
      - name: Browser smoke test against the real Rust core
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          cargo build --locked --release -p stannum-core --example dev_bridge
          ./target/release/examples/dev_bridge &
          npx vite preview --port 1420 --strictPort &
          npx wait-on -t 60000 http://localhost:1420
          F=crates/stannum-core/tests/fixtures
          STANNUM_MATPOWER=$PWD/$F/case9.m STANNUM_RAW=$PWD/$F/five_bus.raw STANNUM_RAW_B=$PWD/$F/five_bus_modified.raw \
            STANNUM_RAW_DC=$PWD/crates/rs-power/tests/fixtures/raw/t_psse_case3.raw \
            STANNUM_DC_A=$PWD/$F/five_bus_dc.raw STANNUM_DC_B=$PWD/$F/five_bus_dc_modified.raw \
            STANNUM_VIOLATIONS=$PWD/crates/rs-power/tests/fixtures/case300.m \
            STANNUM_VSC_CASE=$PWD/$F/vsc_grids/two_area.m STANNUM_VSC_GRIDS=$PWD/$F/vsc_grids/two_area.dcgrid.json \
            node tests/browser/smoke.mjs
