# Weekly dependency updates. Minor and patch bumps arrive as one grouped PR
# per ecosystem; major bumps arrive on their own so they can be checked.
# New releases wait a few days before Dependabot proposes them, which keeps
# us clear of most hijacked or quickly-yanked package versions.
# Security updates are separate and are not delayed.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels: [dependencies, rust]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    groups:
      docs-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 3
    labels: [dependencies, documentation]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
