[package]
name = "stannum-cli"
version = "1.0.0"
edition = "2024"
description = "Run Stannum run files without the app, and serve Stannum to AI assistants over MCP"
publish = false
license.workspace = true

[[bin]]
name = "stannum-cli"
path = "src/main.rs"

[dependencies]
stannum-core = { path = "../stannum-core" }
# A faster allocator: reading an 80,000-bus case's records takes half the
# time it takes with the system one.
mimalloc = { version = "0.1", default-features = false }
serde_json = "1"
