[package]
name = "stannum-cli"
version = "0.5.0"
edition = "2024"
description = "Run Stannum run files without the app, and serve Stannum to AI assistants over MCP"
publish = false
license.workspace = true

[[bin]]
name = "stannum-cli"
path = "src/main.rs"

[dependencies]
stannum-core = { path = "../stannum-core" }
serde_json = "1"
