[package]
name = "stannum-py"
version = "0.5.0"
edition = "2024"
description = "Stannum's analysis core as a Python package (`import stannum`)"
publish = false
license.workspace = true

# maturin builds this into stannum/_native; the Python half is in python/.
[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
stannum-core = { path = "../stannum-core" }
serde_json = "1"
# abi3: one wheel per platform works on Python 3.10 and newer.
pyo3 = { version = "0.30", features = ["abi3-py310"] }
