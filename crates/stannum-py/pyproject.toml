[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "stannum"
description = "Power flow, contingencies, topology and case comparison from Python, with Stannum's analysis core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
test = ["pytest>=7"]

[project.urls]
Documentation = "https://sklorgalore.github.io/StannumRevival/guide/python/"
Source = "https://github.com/SklorGalore/StannumRevival"

[tool.maturin]
python-source = "python"
module-name = "stannum._native"
manifest-path = "Cargo.toml"
strip = true
exclude = ["**/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
