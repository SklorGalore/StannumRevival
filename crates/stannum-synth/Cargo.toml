[package]
name = "stannum-synth"
version = "0.2.0"
edition = "2024"
description = "Synthetic power system cases built and validated with the structural criteria of Birchfield et al. (2017)"
publish = false
license.workspace = true

[dependencies]
rs-power = { path = "../rs-power" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
delaunator = "1.1"
log = "0.4"

[dev-dependencies]
# The example writes cases as Stannum files.
stannum-core = { path = "../stannum-core" }
