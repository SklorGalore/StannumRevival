[package]
name = "stannum-core"
version = "0.2.0"
edition = "2024"
description = "Analysis core for Stannum: power flow, topology and RAW case comparison"
publish = false

[dependencies]
# Pinned so builds are reproducible; bump the rev to pick up upstream changes.
rs-power = { git = "https://github.com/SklorGalore/rs-power", rev = "860ee93958996f2fa38a2ea7731ca435c0455742" }
nodal = { git = "https://github.com/SklorGalore/nodal", rev = "05ad9da9a3bb11ad87bb389a6f50f557a6bfb715" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
thiserror = "2"
