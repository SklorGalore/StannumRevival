[package]
name = "stannum-core"
version = "0.2.0"
edition = "2024"
description = "Analysis core for Stannum: power flow, topology and RAW case comparison"
publish = false

[dependencies]
rs-power = { path = "../rs-power" }
nodal = { path = "../nodal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = "0.4"
encoding_rs = "0.8"
thiserror = "2"
log = "0.4"
sha2 = "0.10"

[dev-dependencies]
stannum-synth = { path = "../stannum-synth" }
