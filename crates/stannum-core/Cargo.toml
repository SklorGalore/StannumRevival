[package]
name = "stannum-core"
version = "0.2.0"
edition = "2024"
description = "Analysis core for Stannum: power flow, topology and RAW case comparison"
publish = false
license.workspace = true

[features]
# Lets tests make a named command panic (crash::inject).
fault-injection = []

[dependencies]
rs-power = { path = "../rs-power" }
nodal = { path = "../nodal", features = ["schemars"] }
stannum-format = { path = "../stannum-format" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a number written to a run or study file reads back as the
# same f64 (the default parser can be one unit in the last place off).
serde_json = { version = "1", features = ["float_roundtrip"] }
num-complex = "0.4"
encoding_rs = "0.8"
thiserror = "2"
schemars = "1"
log = "0.4"
sha2 = "0.11"
getrandom = "0.4"

[dev-dependencies]
stannum-synth = { path = "../stannum-synth" }
