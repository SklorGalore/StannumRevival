[package]
name = "stannum-core"
version = "0.2.0"
edition = "2024"
description = "Analysis core for Stannum: power flow, topology and RAW case comparison"
publish = false
license.workspace = true

[features]
# Lets tests make a named command panic (crash::inject).
fault-injection = []

[dependencies]
rs-power = { path = "../rs-power" }
nodal = { path = "../nodal", features = ["schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = "0.4"
encoding_rs = "0.8"
thiserror = "2"
schemars = "1"
log = "0.4"
sha2 = "0.10"
getrandom = "0.4"

[dev-dependencies]
stannum-synth = { path = "../stannum-synth" }
