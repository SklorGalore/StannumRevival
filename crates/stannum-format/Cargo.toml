[package]
name = "stannum-format"
version = "0.1.0"
edition = "2024"
description = "Reader and writer for Stannum's open case (.stn) and lists (.stnl) formats"
publish = false
license.workspace = true

[dependencies]
arrow-array = "60.1.0"
arrow-buffer = "60.1.0"
arrow-ipc = { version = "60.1.0", features = ["zstd"] }
arrow-schema = "60.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.1"
zip = { version = "9.1.3", default-features = false }

[dev-dependencies]
serde_json = "1"
zip = { version = "9.1.3", default-features = false }
