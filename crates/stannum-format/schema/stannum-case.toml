[[table]]
name = "vsc_line"
kind = "dcline"
id = "{sort(c1_bus,c2_bus)}:{name}"
order = ["name"]
doc = "A two-terminal voltage-source-converter DC line."
fields = [
  { name = "name", type = "string", required = true, doc = "Line name, unique among DC lines." },
  { name = "status", type = "status", default = "on", doc = "In service (`on`) or out of service (`off`)." },
  { name = "r_ohm", type = "float", unit = "ohm", default = 0.0, doc = "DC line resistance." },
  { name = "owners", type = "list", item = ["softref:owner", "float"], default = [], doc = "Owners and their shares, as `[owner, fraction]` pairs, at most four. Empty means the owner of the first bus, 100 percent." },
  { name = "c1_bus", type = "ref", to = "bus", required = true, doc = "Converter 1 AC bus." },
