# Stannum case schema: every table and field, with its type, unit and default.
# This file is the source of truth for the format; the reader, the writer and
# the reference docs are built from it. See docs-site reference/case-file.md.
#
# Field types: int, float, bool, status (on/off), string, enum (one of
# `values`), ref (the id of a record in table `to`; `soft` refs may name a
# record the file doesn't have), element (a typed reference `kind:id`), and
# list (of `item`: one type, or a tuple of types; `item_min` is the shortest
# tuple allowed). A field with no `default` and not `required` is absent
# unless set, and absent means "none".

format = "stannum-case"
version = "0.1"
doc = "Stannum case: the network and its operating state."

[[table]]
name = "case"
kind = "case"
id = "main"
order = []
singleton = true
doc = "The case itself: exactly one record, with the id `main`."
fields = [
  { name = "name", type = "string", default = "", doc = "Case title (RAW title line 1)." },
  { name = "description", type = "string", default = "", doc = "Second title line or a longer description." },
  { name = "base_mva", type = "float", unit = "MVA", default = 100.0, doc = "System MVA base; per-unit values on the system base use it." },
  { name = "frequency_hz", type = "float", unit = "Hz", default = 60.0, doc = "System base frequency." },
  { name = "rating_names", type = "list", item = ["string"], default = ["A", "B", "C"], doc = "What rating slots 1 to 12 are, by name. The app treats the first three as ratings A, B and C." },
]

[[table]]
name = "area"
kind = "area"
id = "{number}"
order = ["number"]
doc = "A control area."
fields = [
  { name = "number", type = "int", required = true, doc = "Area number." },
  { name = "name", type = "string", default = "", doc = "Area name." },
  { name = "slack_bus", type = "ref", to = "bus", doc = "Bus whose generation balances the area's interchange; none when absent." },
  { name = "export_mw", type = "float", unit = "MW", default = 0.0, doc = "Desired net export; negative imports." },
  { name = "tolerance_mw", type = "float", unit = "MW", default = 10.0, doc = "Interchange tolerance band." },
]

[[table]]
name = "zone"
kind = "zone"
id = "{number}"
order = ["number"]
doc = "A zone."
fields = [
  { name = "number", type = "int", required = true, doc = "Zone number." },
  { name = "name", type = "string", default = "", doc = "Zone name." },
]

[[table]]
name = "owner"
kind = "owner"
id = "{number}"
order = ["number"]
doc = "An owner."
fields = [
  { name = "number", type = "int", required = true, doc = "Owner number." },
  { name = "name", type = "string", default = "", doc = "Owner name." },
]

[[table]]
name = "area_transfer"
kind = "area-transfer"
id = "{from_area}:{to_area}:{label}"
order = ["from_area", "to_area", "label"]
doc = "A scheduled transfer between two areas."
fields = [
  { name = "from_area", type = "ref", to = "area", soft = true, required = true, doc = "Exporting area." },
  { name = "to_area", type = "ref", to = "area", soft = true, required = true, doc = "Importing area." },
  { name = "label", type = "string", default = "1", doc = "Transfer identifier." },
  { name = "p_mw", type = "float", unit = "MW", default = 0.0, doc = "Scheduled transfer from `from_area` to `to_area`." },
]

[[table]]
name = "bus"
kind = "bus"
id = "{number}"
order = ["number"]
doc = "A bus."
fields = [
  { name = "number", type = "int", required = true, doc = "Bus number, 1 to 999997, unique in the case." },
  { name = "name", type = "string", default = "", doc = "Bus name." },
  { name = "kv", type = "float", unit = "kV", default = 0.0, doc = "Base voltage, line to line." },
  { name = "type", type = "enum", values = ["pq", "pv", "ref", "isolated"], default = "pq", doc = "How power flow treats the bus: `pq` load bus, `pv` generator bus, `ref` swing bus, `isolated` out of the solve." },
  { name = "area", type = "ref", to = "area", soft = true, default = "1", doc = "Area." },
  { name = "zone", type = "ref", to = "zone", soft = true, default = "1", doc = "Zone." },
  { name = "owner", type = "ref", to = "owner", soft = true, default = "1", doc = "Owner." },
  { name = "vm_pu", type = "float", unit = "pu", default = 1.0, doc = "Voltage magnitude: the starting or last solved value." },
  { name = "va_deg", type = "float", unit = "deg", default = 0.0, doc = "Voltage angle: the starting or last solved value." },
  { name = "vmax_pu", type = "float", unit = "pu", default = 1.1, doc = "Normal upper voltage limit." },
  { name = "vmin_pu", type = "float", unit = "pu", default = 0.9, doc = "Normal lower voltage limit." },
  { name = "evmax_pu", type = "float", unit = "pu", default = 1.1, doc = "Emergency upper voltage limit." },
  { name = "evmin_pu", type = "float", unit = "pu", default = 0.9, doc = "Emergency lower voltage limit." },
  { name = "lat", type = "float", unit = "deg", doc = "Latitude (WGS 84), when the bus has a place." },
  { name = "lon", type = "float", unit = "deg", doc = "Longitude (WGS 84), when the bus has a place." },
]

[[table]]
name = "load"
kind = "load"
id = "{bus}:{label}"
order = ["bus", "label"]
doc = "A load. Every reactive part is MVAr consumed, so positive is inductive."
fields = [
  { name = "bus", type = "ref", to = "bus", required = true, doc = "Bus." },
  { name = "label", type = "string", default = "1", doc = "Load identifier, unique at its bus." },
  { name = "status", type = "status", default = "on", doc = "In service (`on`) or out of service (`off`)." },
  { name = "area", type = "ref", to = "area", soft = true, doc = "Area, when it isn't the bus's." },
  { name = "zone", type = "ref", to = "zone", soft = true, doc = "Zone, when it isn't the bus's." },
  { name = "owner", type = "ref", to = "owner", soft = true, doc = "Owner, when it isn't the bus's." },
  { name = "p_mw", type = "float", unit = "MW", default = 0.0, doc = "Constant-power active load." },
  { name = "q_mvar", type = "float", unit = "MVAr", default = 0.0, doc = "Constant-power reactive load." },
  { name = "ip_mw", type = "float", unit = "MW", default = 0.0, doc = "Constant-current active load at 1 pu voltage." },
  { name = "iq_mvar", type = "float", unit = "MVAr", default = 0.0, doc = "Constant-current reactive load at 1 pu voltage." },
  { name = "yp_mw", type = "float", unit = "MW", default = 0.0, doc = "Constant-admittance active load at 1 pu voltage." },
  { name = "yq_mvar", type = "float", unit = "MVAr", default = 0.0, doc = "Constant-admittance reactive load at 1 pu voltage (the negative of PSS/E's YQ)." },
  { name = "scalable", type = "bool", default = true, doc = "Whether load scaling may change it." },
  { name = "interruptible", type = "bool", default = false, doc = "Whether it is interruptible." },
  { name = "dgen_p_mw", type = "float", unit = "MW", default = 0.0, doc = "Distributed generation, active." },
  { name = "dgen_q_mvar", type = "float", unit = "MVAr", default = 0.0, doc = "Distributed generation, reactive." },
  { name = "dgen_on", type = "bool", default = false, doc = "Whether the distributed generation is in service." },
  { name = "load_type", type = "string", default = "", doc = "Free-text load type." },
]

[[table]]
name = "shunt"
kind = "shunt"
id = "{bus}:{label}"
order = ["bus", "label"]
doc = "A fixed shunt."
fields = [
  { name = "bus", type = "ref", to = "bus", required = true, doc = "Bus." },
  { name = "label", type = "string", default = "1", doc = "Shunt identifier, unique at its bus." },
  { name = "status", type = "status", default = "on", doc = "In service (`on`) or out of service (`off`)." },
  { name = "g_mw", type = "float", unit = "MW", default = 0.0, doc = "Active power consumed at 1 pu voltage." },
  { name = "b_mvar", type = "float", unit = "MVAr", default = 0.0, doc = "Reactive power injected at 1 pu voltage; positive is capacitive." },
]

[[table]]
name = "generator"
kind = "generator"
id = "{bus}:{label}"
order = ["bus", "label"]
doc = "A generator."
fields = [
  { name = "bus", type = "ref", to = "bus", required = true, doc = "Bus." },
  { name = "label", type = "string", default = "1", doc = "Machine identifier, unique at its bus." },
  { name = "status", type = "status", default = "on", doc = "In service (`on`) or out of service (`off`)." },
  { name = "p_mw", type = "float", unit = "MW", default = 0.0, doc = "Active output." },
  { name = "q_mvar", type = "float", unit = "MVAr", default = 0.0, doc = "Reactive output: the starting or last solved value." },
  { name = "qmax_mvar", type = "float", unit = "MVAr", default = 9999.0, doc = "Upper reactive limit." },
  { name = "qmin_mvar", type = "float", unit = "MVAr", default = -9999.0, doc = "Lower reactive limit." },
  { name = "vset_pu", type = "float", unit = "pu", default = 1.0, doc = "Voltage setpoint at the regulated bus." },
  { name = "reg_bus", type = "ref", to = "bus", doc = "Bus whose voltage it holds, when not its own." },
  { name = "reg_node", type = "int", doc = "Node of the regulated bus in its substation, when the bus has one." },
  { name = "mva_base", type = "float", unit = "MVA", doc = "Machine base; the system base when absent." },
  { name = "source_r_pu", type = "float", unit = "pu", default = 0.0, doc = "Source resistance on the machine base." },
  { name = "source_x_pu", type = "float", unit = "pu", default = 1.0, doc = "Source reactance on the machine base." },
  { name = "gsu_r_pu", type = "float", unit = "pu", default = 0.0, doc = "Step-up transformer resistance on the machine base; 0 when there is none." },
  { name = "gsu_x_pu", type = "float", unit = "pu", default = 0.0, doc = "Step-up transformer reactance on the machine base; 0 when there is none." },
  { name = "gsu_tap_pu", type = "float", unit = "pu", default = 1.0, doc = "Step-up transformer ratio." },
  { name = "rmpct", type = "float", unit = "%", default = 100.0, doc = "Share of the reactive power that holds a remote bus." },
  { name = "pmax_mw", type = "float", unit = "MW", default = 9999.0, doc = "Upper active limit." },
  { name = "pmin_mw", type = "float", unit = "MW", default = -9999.0, doc = "Lower active limit." },
  { name = "dispatch", type = "enum", values = ["both", "down_only", "none", "up_only"], default = "both", doc = "Which way dispatch may move it: `both`, `down_only`, `none`, `up_only` (PSS/E BASLOD 0 to 3)." },
  { name = "owners", type = "list", item = ["softref:owner", "float"], default = [], doc = "Owners and their shares, as `[owner, fraction]` pairs, at most four. Empty means the owner of the first bus, 100 percent." },
  { name = "wind_mode", type = "enum", values = ["conventional", "q_limits", "pf_limits", "fixed_pf"], default = "conventional", doc = "`conventional`, or a wind machine whose reactive limits come from `q_limits`, from `pf_limits` (wind_pf) or that holds `fixed_pf`." },
  { name = "wind_pf", type = "float", default = 1.0, doc = "Power factor for the wind modes that use one." },
]

[[table]]
name = "line"
kind = "line"
id = "{sort(from,to)}:{ckt}"
order = ["from", "to", "ckt"]
doc = "An AC line."
fields = [
  { name = "from", type = "ref", to = "bus", required = true, doc = "From bus." },
  { name = "to", type = "ref", to = "bus", required = true, doc = "To bus." },
  { name = "ckt", type = "string", default = "1", doc = "Circuit identifier, unique between the two buses." },
  { name = "status", type = "status", default = "on", doc = "In service (`on`) or out of service (`off`)." },
  { name = "r_pu", type = "float", unit = "pu", default = 0.0, doc = "Series resistance on the system base." },
  { name = "x_pu", type = "float", unit = "pu", default = 0.0, doc = "Series reactance on the system base." },
  { name = "b_pu", type = "float", unit = "pu", default = 0.0, doc = "Total charging susceptance on the system base." },
  { name = "name", type = "string", default = "", doc = "Line name." },
  { name = "rate1_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 1 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate2_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 2 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate3_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 3 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate4_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 4 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate5_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 5 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate6_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 6 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate7_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 7 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate8_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 8 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate9_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 9 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate10_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 10 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate11_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 11 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate12_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 12 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "gi_pu", type = "float", unit = "pu", default = 0.0, doc = "Shunt conductance at the from end, system base." },
  { name = "bi_pu", type = "float", unit = "pu", default = 0.0, doc = "Shunt susceptance at the from end, system base." },
  { name = "gj_pu", type = "float", unit = "pu", default = 0.0, doc = "Shunt conductance at the to end, system base." },
  { name = "bj_pu", type = "float", unit = "pu", default = 0.0, doc = "Shunt susceptance at the to end, system base." },
  { name = "metered", type = "enum", values = ["from", "to"], default = "from", doc = "Which end losses are metered at." },
  { name = "length", type = "float", default = 0.0, doc = "Length, in the unit the case's author chose." },
  { name = "owners", type = "list", item = ["softref:owner", "float"], default = [], doc = "Owners and their shares, as `[owner, fraction]` pairs, at most four. Empty means the owner of the first bus, 100 percent." },
]

[[table]]
name = "switch"
kind = "switch"
id = "{sort(from,to)}:{ckt}"
order = ["from", "to", "ckt"]
doc = "A switching device (breaker, disconnector or other)."
fields = [
  { name = "from", type = "ref", to = "bus", required = true, doc = "From bus." },
  { name = "to", type = "ref", to = "bus", required = true, doc = "To bus." },
  { name = "ckt", type = "string", default = "1", doc = "Circuit identifier." },
  { name = "x_pu", type = "float", unit = "pu", default = 0.0001, doc = "Reactance on the system base." },
  { name = "rate1_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 1 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate2_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 2 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate3_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 3 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate4_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 4 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate5_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 5 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate6_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 6 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate7_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 7 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate8_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 8 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate9_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 9 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate10_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 10 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate11_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 11 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate12_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 12 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "status", type = "status", default = "on", doc = "Closed (`on`) or open (`off`)." },
  { name = "normal", type = "enum", values = ["closed", "open"], default = "closed", doc = "Its normal state." },
  { name = "metered", type = "enum", values = ["from", "to"], default = "from", doc = "Which end losses are metered at." },
  { name = "kind", type = "enum", values = ["generic", "breaker", "disconnector"], default = "generic", doc = "What it is." },
  { name = "name", type = "string", default = "", doc = "Device name." },
]

[[table]]
name = "transformer"
kind = "transformer"
id = "{sort(from,to)}:{ckt}"
order = ["from", "to", "ckt"]
doc = "A two-winding transformer. Impedances are per unit on its own `mva_base` and winding voltages."
fields = [
  { name = "from", type = "ref", to = "bus", required = true, doc = "Winding 1 bus." },
  { name = "to", type = "ref", to = "bus", required = true, doc = "Winding 2 bus." },
  { name = "ckt", type = "string", default = "1", doc = "Circuit identifier." },
  { name = "status", type = "status", default = "on", doc = "In service (`on`) or out of service (`off`)." },
  { name = "name", type = "string", default = "", doc = "Transformer name." },
  { name = "metered", type = "enum", values = ["from", "to"], default = "to", doc = "Which end losses are metered at." },
  { name = "mva_base", type = "float", unit = "MVA", doc = "Base of `r_pu`, `x_pu` and the magnetizing admittance; the system base when absent." },
  { name = "r_pu", type = "float", unit = "pu", default = 0.0, doc = "Series resistance on `mva_base`." },
  { name = "x_pu", type = "float", unit = "pu", default = 0.0, doc = "Series reactance on `mva_base`." },
  { name = "mag_g_pu", type = "float", unit = "pu", default = 0.0, doc = "Magnetizing conductance on `mva_base`." },
  { name = "mag_b_pu", type = "float", unit = "pu", default = 0.0, doc = "Magnetizing susceptance on `mva_base`; negative is inductive." },
  { name = "w1_tap_pu", type = "float", unit = "pu", default = 1.0, doc = "Winding 1 ratio, in pu of its nominal voltage." },
  { name = "w1_kv", type = "float", unit = "kV", doc = "Winding 1 nominal voltage; the from bus's base voltage when absent." },
  { name = "w1_angle_deg", type = "float", unit = "deg", default = 0.0, doc = "Winding 1 phase shift." },
  { name = "w2_tap_pu", type = "float", unit = "pu", default = 1.0, doc = "Winding 2 ratio, in pu of its nominal voltage." },
  { name = "w2_kv", type = "float", unit = "kV", doc = "Winding 2 nominal voltage; the to bus's base voltage when absent." },
  { name = "rate1_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 1 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate2_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 2 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate3_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 3 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate4_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 4 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate5_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 5 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate6_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 6 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate7_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 7 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate8_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 8 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate9_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 9 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate10_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 10 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate11_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 11 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "rate12_mva", type = "float", unit = "MVA", default = 0.0, doc = "Rating 12 in MVA; 0 means none. `case.rating_names` says what each slot is." },
  { name = "control", type = "enum", values = ["none", "voltage", "reactive_flow", "active_flow", "dc_line", "asymmetric_active_flow"], default = "none", doc = "What the winding's tap or angle adjusts to hold: `none`, `voltage`, `reactive_flow`, `active_flow` (a phase shifter), `dc_line`, `asymmetric_active_flow`." },
  { name = "control_on", type = "bool", default = true, doc = "Whether that adjustment is enabled; `false` keeps the control data but locks the tap." },
  { name = "reg_bus", type = "ref", to = "bus", doc = "Bus whose voltage the control holds." },
  { name = "reg_bus_reversed", type = "bool", default = false, doc = "The regulated bus is on the winding's own side, so the tap moves the other way (PSS/E negative CONT)." },
  { name = "reg_node", type = "int", doc = "Node of the regulated bus in its substation." },
  { name = "adjust_max", type = "float", unit = "pu or deg", default = 1.1, doc = "Upper limit of the tap (pu of the winding's nominal voltage) or of the angle (degrees, active-flow control)." },
  { name = "adjust_min", type = "float", unit = "pu or deg", default = 0.9, doc = "Lower limit of the tap or angle." },
  { name = "band_max", type = "float", unit = "pu, MVAr or MW", default = 1.1, doc = "Upper end of the band the control holds: voltage in pu, or flow in MVAr or MW." },
  { name = "band_min", type = "float", unit = "pu, MVAr or MW", default = 0.9, doc = "Lower end of that band." },
  { name = "steps", type = "int", default = 33, doc = "Number of tap positions." },
  { name = "impedance_table", type = "ref", to = "impedance_table", doc = "Impedance correction table." },
  { name = "comp_r_pu", type = "float", unit = "pu", default = 0.0, doc = "Load-drop compensation resistance." },
