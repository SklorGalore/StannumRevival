  { name = "c1_ac_mode", type = "enum", values = ["voltage", "power_factor"], default = "voltage", doc = "What it holds on the AC side: `voltage` or `power_factor`." },
  { name = "c1_dc_set", type = "float", unit = "kV or MW", default = 0.0, doc = "DC setpoint: voltage in kV, or power in MW (positive into the DC line)." },
