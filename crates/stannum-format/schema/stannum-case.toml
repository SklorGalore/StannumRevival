[[table]]
name = "multi_section_line"
kind = "multi-section-line"
id = "{sort(from,to)}:{label}"
order = ["from", "to", "label"]
doc = "A line made of several sections in series, grouped for switching."
fields = [
  { name = "from", type = "ref", to = "bus", required = true, doc = "From bus." },
  { name = "to", type = "ref", to = "bus", required = true, doc = "To bus." },
  { name = "label", type = "string", default = "&1", doc = "Group identifier, starting with &." },
  { name = "metered", type = "enum", values = ["from", "to"], default = "from", doc = "Which end losses are metered at." },
  { name = "via", type = "list", item = ["ref:bus"], default = [], doc = "Buses between the sections, in order from `from`." },
]

[[table]]
name = "facts"
kind = "facts"
id = "{name}"
order = ["name"]
doc = "A FACTS device: a shunt element, a series element, or both."
fields = [
  { name = "name", type = "string", required = true, doc = "Device name." },
  { name = "from", type = "ref", to = "bus", required = true, doc = "Sending-end bus (shunt element)." },
  { name = "to", type = "ref", to = "bus", doc = "Terminal-end bus of the series element; none for a shunt-only device." },
  { name = "mode", type = "enum", values = ["off", "normal", "shunt_only", "constant_impedance", "constant_voltage", "ipfc_master_pq", "ipfc_slave_pq", "ipfc_master_voltage", "ipfc_slave_voltage"], default = "normal", doc = "Operating mode (PSS/E MODE 0 to 8)." },
  { name = "p_set_mw", type = "float", unit = "MW", default = 0.0, doc = "Active flow setpoint at the terminal end." },
  { name = "q_set_mvar", type = "float", unit = "MVAr", default = 0.0, doc = "Reactive flow setpoint at the terminal end." },
  { name = "vset_pu", type = "float", unit = "pu", default = 1.0, doc = "Voltage setpoint at the sending end." },
  { name = "shunt_max_mva", type = "float", unit = "MVA", default = 9999.0, doc = "Largest shunt current, as MVA at 1 pu." },
  { name = "series_max_mw", type = "float", unit = "MW", default = 9999.0, doc = "Largest bridge active power transfer." },
  { name = "vt_min_pu", type = "float", unit = "pu", default = 0.9, doc = "Smallest terminal-end voltage." },
  { name = "vt_max_pu", type = "float", unit = "pu", default = 1.1, doc = "Largest terminal-end voltage." },
  { name = "vs_max_pu", type = "float", unit = "pu", default = 1.0, doc = "Largest series voltage." },
  { name = "imax_mva", type = "float", unit = "MVA", default = 0.0, doc = "Largest series current, as MVA at 1 pu; 0 means none." },
  { name = "linx_pu", type = "float", unit = "pu", default = 0.05, doc = "Reactance of the dummy series element used in some modes." },
  { name = "rmpct", type = "float", unit = "%", default = 100.0, doc = "Share of the reactive power that holds a remote bus." },
  { name = "owner", type = "ref", to = "owner", soft = true, default = "1", doc = "Owner." },
  { name = "set1", type = "float", default = 0.0, doc = "Series impedance (R) or voltage magnitude setpoint, by mode." },
  { name = "set2", type = "float", default = 0.0, doc = "Series impedance (X) or voltage angle setpoint, by mode." },
  { name = "series_ref", type = "enum", values = ["voltage", "impedance"], default = "voltage", doc = "What `set1` and `set2` are: series `voltage` or `impedance`." },
  { name = "reg_bus", type = "ref", to = "bus", doc = "Bus whose voltage it holds, when not the sending end." },
  { name = "ipfc_partner", type = "string", default = "", doc = "Name of the IPFC master device, for slave modes." },
]
