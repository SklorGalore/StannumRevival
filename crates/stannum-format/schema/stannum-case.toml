  { name = "inv_rc_ohm", type = "float", unit = "ohm", default = 0.0, doc = "Commutating resistance per bridge." },
  { name = "inv_xc_ohm", type = "float", unit = "ohm", default = 0.0, doc = "Commutating reactance per bridge." },
  { name = "inv_ebase_kv", type = "float", unit = "kV", default = 0.0, doc = "Primary base AC voltage." },
  { name = "inv_ratio", type = "float", default = 1.0, doc = "Transformer ratio." },
  { name = "inv_tap_pu", type = "float", unit = "pu", default = 1.0, doc = "Tap setting." },
  { name = "inv_tap_max_pu", type = "float", unit = "pu", default = 1.5, doc = "Largest tap." },
  { name = "inv_tap_min_pu", type = "float", unit = "pu", default = 0.51, doc = "Smallest tap." },
  { name = "inv_tap_step_pu", type = "float", unit = "pu", default = 0.00625, doc = "Tap step." },
  { name = "inv_commutating_bus", type = "ref", to = "bus", doc = "Commutating bus, when not the AC bus." },
  { name = "inv_commutating_node", type = "int", doc = "Node of the commutating bus." },
