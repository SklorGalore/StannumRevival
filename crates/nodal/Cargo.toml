[package]
name = "nodal"
version = "0.1.0"
edition = "2024"
description = "PSS/E RAW v35 parser and network topology analysis"
publish = false
license.workspace = true

[dependencies]
rustworkx-core = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
schemars = { version = "1", optional = true }

[features]
# JSON schemas for the topology results (used by stannum-core).
schemars = ["dep:schemars"]
