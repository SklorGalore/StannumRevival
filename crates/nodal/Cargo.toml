[package]
name = "nodal"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustworkx-core = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.4", features = ["wasm_js"] }
