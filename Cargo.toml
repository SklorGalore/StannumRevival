[package]
name = "rs-power"
version = "0.1.0"
edition = "2024"
description = "Sparse AC and DC power flow with MATPOWER case support"
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/SklorGalore/rs-power"
homepage = "https://github.com/SklorGalore/rs-power"
documentation = "https://docs.rs/rs-power"
keywords = ["power-flow", "electrical", "matpower", "psse", "sparse"]
categories = ["science", "simulation"]
include = [
    "/src/**",
    "/examples/**",
    "/benches/**",
    "/tests/**",
    "/_cases/**",
    "/scripts/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/GUI_PLAN.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
]

[dependencies]
eframe = { version = "0.36", optional = true }
egui_extras = { version = "0.36", optional = true }
env_logger = "0.11"
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
log = "0.4"
num-complex = "0.4"
rfd = { version = "0.17", optional = true }
thiserror = "2"

[features]
default = []
gui = ["dep:eframe", "dep:egui_extras", "dep:rfd"]

[[bin]]
name = "rs-power-gui"
path = "src/bin/rs-power-gui/main.rs"
required-features = ["gui"]

[dev-dependencies]
serde_json = "1"

[[bench]]
name = "power_flow"
harness = false
