[package]
name = "stannum"
version = "0.2.0"
description = "Stannum: single-line diagrams, power flow, topology and RAW case comparison"
edition = "2021"

[lib]
name = "stannum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
stannum-core = { path = "../crates/stannum-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
