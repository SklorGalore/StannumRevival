[package]
name = "nodal-desktop"
version = "0.1.0"
description = "Nodal desktop application"
edition = "2024"
rust-version = "1.90"

[lib]
name = "nodal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nodal"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
